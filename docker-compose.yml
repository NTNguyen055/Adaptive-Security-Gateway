services:

  # ===========================================================================
  # DJANGO APPLICATION
  # ===========================================================================
  app:
    image: ntnguyen055/adaptive-security-app:latest
    container_name: docapp_django
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh

    expose:
      - "8000"

    env_file:
      - /home/ubuntu/appointment-web/.env

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: 
        - "CMD-SHELL"
        - "python -c \"import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https', 'Host': 'localhost'}); urllib.request.urlopen(req)\" || exit 1"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      gunicorn docappsystem.wsgi:application 
      --bind 0.0.0.0:8000 
      --workers $${GUNICORN_WORKERS:-2} 
      --threads $${GUNICORN_THREADS:-2} 
      --timeout $${GUNICORN_TIMEOUT:-60} 
      --max-requests 1000 
      --max-requests-jitter 100 
      --access-logfile - 
      --error-logfile - 
      --log-level info
      "

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - internal

  # ===========================================================================
  # REDIS (In-Memory Only)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: docapp_redis
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh

    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-keepalive 60
      --timeout 300
      --loglevel warning

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          memory: 160m
          cpus: "0.5"
        reservations:
          memory: 64m

    networks:
      - internal

  # ===========================================================================
  # OPENRESTY GATEWAY
  # ===========================================================================
  gateway:
    image: ntnguyen055/adaptive-security-gateway:latest
    container_name: openresty_gateway
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh

    ports:
      - "80:80"
      - "443:443"
      # [FIX] Bind metrics port chỉ trên localhost để ngăn truy cập từ Internet.
      # Prometheus container trong cùng network 'internal' vẫn có thể scrape được.
      - "127.0.0.1:9145:9145"

    env_file:
      - /home/ubuntu/appointment-web/.env

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
      - ./logs/nginx:/usr/local/openresty/nginx/logs
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua:/usr/local/openresty/nginx/lua:ro

    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 4 -H 'Host: dacn3.duckdns.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1/health/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    networks:
      - internal

  # ===========================================================================
  # PROMETHEUS (Thu thập Metrics)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal

  # ===========================================================================
  # GRAFANA (Vẽ biểu đồ Dashboard)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      # [FIX] Lấy credentials từ .env thay vì hardcode 'admin/admin'.
      # Thiết lập GRAFANA_ADMIN_PASSWORD mạnh trong file .env trước khi deploy.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      # Disable sign-up cho user mới để khóa cửớng Grafana khỏi Internet
      - GF_USERS_ALLOW_SIGN_UP=false
      # Chỉ cho phép đăng nhập qua local browser (không có OAuth public)
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - internal

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================
volumes:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24