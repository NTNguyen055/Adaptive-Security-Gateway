services:

  # ===========================================================================
  # DJANGO APPLICATION
  # ===========================================================================
  app:
    image: ntnguyen055/adaptive-security-app:latest
    container_name: docapp_django
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh

    expose:
      - "8000"

    env_file:
      - /home/ubuntu/appointment-web/.env

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host = next((h.strip() for h in os.environ.get('ALLOWED_HOSTS', '').split(',') if h.strip()), 'localhost'); req = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https', 'Host': host}); urllib.request.urlopen(req, timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      exec gunicorn docappsystem.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-2}
      --threads $${GUNICORN_THREADS:-2}
      --timeout $${GUNICORN_TIMEOUT:-60}
      --max-requests 1000
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
      --log-level info
      "

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - internal


  # REDIS — Security state persistence
  redis:
    image: redis@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    container_name: docapp_redis
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh

    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
      --timeout 300
      --loglevel warning

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.5"
        reservations:
          memory: 64m

    networks:
      - internal

  # ===========================================================================
  # OPENRESTY GATEWAY
  # ===========================================================================
  gateway:
    image: ntnguyen055/adaptive-security-gateway:latest
    container_name: openresty_gateway
    restart: unless-stopped

    environment:
      - TZ=Asia/Ho_Chi_Minh

    ports:
      - "80:80"
      - "443:443"
      # [FIX] Bind metrics port chỉ trên localhost để ngăn truy cập từ Internet.
      # Prometheus container trong cùng network 'internal' vẫn có thể scrape được.
      - "127.0.0.1:9145:9145"

    env_file:
      - /home/ubuntu/appointment-web/.env

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
      - ./logs/nginx:/usr/local/openresty/nginx/logs
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua:/usr/local/openresty/nginx/lua:ro

    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 4 -H 'Host: asg-datn.duckdns.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1/health/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    networks:
      - internal

  # ===========================================================================
  # PROMETHEUS (Thu thập Metrics)
  # ===========================================================================
  prometheus:
    image: prom/prometheus@sha256:3b1d5be5c3eef4f027665ddaa3b1a7de8a58d96a0a6de5dd45629afd267ecaf0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - internal

  # ===========================================================================
  # GRAFANA (Vẽ biểu đồ Dashboard)
  # ===========================================================================
  grafana:
    image: grafana/grafana@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    container_name: grafana
    restart: unless-stopped
    environment:
      # Credentials được lấy từ environment, không hardcode.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}

      # Disable self-service account registration.
      - GF_USERS_ALLOW_SIGN_UP=false

      # Disable anonymous access; authentication is required.
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - internal

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================
volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
