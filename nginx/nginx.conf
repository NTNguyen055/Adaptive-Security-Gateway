# =============================================================================
# Adaptive Web Security Gateway — nginx.conf
# =============================================================================

# Nginx worker processes chạy dưới user 'gateway' (non-root, UID 101) được tạo trong Dockerfile.
# Master process vẫn cần root để bind port 80/443, sau đó drop xuống 'gateway'.
user gateway;

# Tối ưu hóa hiệu năng: Tự động cấp phát số lượng worker process theo số nhân CPU
# và tăng giới hạn số lượng kết nối (file descriptors) tối đa lên 65535 để chịu tải cao.
worker_processes auto;
worker_rlimit_nofile 65535;

# ================= ENV DECLARATIONS =================
# Nginx mặc định xóa sạch các biến môi trường của OS. Phải dùng chỉ thị `env` 
# để giữ lại các cấu hình từ Docker .env, cho phép các file Lua đọc được cấu hình hệ thống.
env JWT_SECRET_KEY;
env RATE_LIMIT_RPS;
env RATE_LIMIT_BURST;
env REDIS_RATE_LIMIT;
env REDIS_RL_WINDOW;
env AUTO_BL_THRESHOLD;
env AUTO_BL_WINDOW;
env AUTO_BL_DURATION;
env RISK_BLOCK_THRESHOLD;
env RISK_LIMIT_THRESHOLD;
env BRUTE_FORCE_MAX_ATTEMPTS;
env BRUTE_FORCE_WINDOW;
env BRUTE_FORCE_RISK_PENALTY;
env BRUTE_FORCE_COOLDOWN;
env TELEGRAM_BOT_TOKEN;
env TELEGRAM_CHAT_ID;
# [NEW] Geo allowlist và Risk Decay — có thể thay đổi mà không cần build lại image
env GEO_ALLOWED_COUNTRIES;
env RISK_DECAY_ENABLED;
env RISK_DECAY_FACTOR;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Khởi tạo biến rỗng mặc định để lưu điểm rủi ro và hành động bảo mật.
    # Biến này sẽ được module Risk Engine (Lua) ghi đè vào để đẩy ra file log.
    map "" $log_risk_score { default "0"; }
    map "" $log_security_block { default "-"; }
    map "" $log_security_reason { default "-"; }
    # Static/media bypass normal access logs to reduce noise, but rejected
    # security decisions must still be captured in the JSON audit stream.
    map $log_security_block $log_security_event {
        default 0;
        block 1;
        limit 1;
    }

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  65;
    keepalive_requests 1000;

    # Tắt hiển thị phiên bản Nginx ở các trang lỗi, chống Information Disclosure.
    server_tokens off;

    # ================= LUA =================
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";
    lua_socket_log_errors off;

    # ================= IDENTITY HEADER SANITIZATION =================
    # Xóa danh tính do client tự khai báo trước khi vào Security Pipeline.
    # jwt_auth.lua chỉ thiết lập lại headers sau khi JWT hợp lệ.
    rewrite_by_lua_block {
        ngx.req.clear_header("X-User-ID")
        ngx.req.clear_header("X-User-Role")
    }

    # ================= REAL IP =================
    # Trích xuất IP thực của người dùng từ Header X-Forwarded-For nếu hệ thống
    # chạy sau Load Balancer/Proxy (như Cloudflare, AWS ALB), bỏ qua các IP nội bộ đáng tin cậy.
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    set_real_ip_from  127.0.0.1;
    set_real_ip_from  172.20.0.0/24; 
    set_real_ip_from  172.31.0.0/16; 

    # ================= SHARED MEMORY =================
    # CORE: Khai báo các vùng nhớ RAM dùng chung (Shared Memory) cho tất cả Nginx Worker.
    # Đây là "L1 Cache" siêu tốc của hệ thống bảo mật, giúp giới hạn Rate Limit, kiểm tra Blacklist,
    # và verify JWT với độ trễ gần như bằng 0 mà không cần gọi xuống Redis.
    lua_shared_dict limit_req_store      10m;
    lua_shared_dict ip_cache             10m;
    lua_shared_dict ua_cache             10m;  
    lua_shared_dict jwt_cache            10m;
    lua_shared_dict prometheus_metrics   10m;
    lua_shared_dict rl_counter           10m;
    lua_shared_dict geo_cache            20m;
    lua_shared_dict brute_force_cache    5m;

    resolver 127.0.0.11 ipv6=off valid=30s;

    upstream django_backend {
        server docapp_django:8000;
        keepalive 32; 
    }

    # ================= REQUEST LIMITS =================
    client_max_body_size    10m;
    client_body_buffer_size 256k;
    client_body_timeout     10s;
    client_header_timeout   10s;
    send_timeout            10s;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # ================= STRUCTURED SECURITY ACCESS LOG =================
    # One JSON object per request. Escaping prevents untrusted header/path values
    # from breaking JSON. Do not include $request, $request_uri, $args or body:
    # query strings may contain tokens or credentials.
    # A new filename avoids mixing historical text access.log lines with JSON.
    log_format security_json escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"request_id":"$request_id",'
          '"client_ip":"$remote_addr",'
          '"method":"$request_method",'
          '"path":"$uri",'
          '"status":$status,'
          '"action":"$log_security_block",'
          '"reason":"$log_security_reason",'
          '"risk_score":$log_risk_score,'
          '"request_time_seconds":$request_time,'
          '"upstream_time_seconds":"$upstream_response_time",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log /usr/local/openresty/nginx/logs/security.json.log security_json buffer=16k flush=5s;
    error_log  /usr/local/openresty/nginx/logs/error.log warn;

    # ================= LOAD LUA MODULES =================
    init_by_lua_block {
        require("resty.maxminddb").init("/etc/nginx/geoip/GeoLite2-Country.mmdb")

        -- Load trước toàn bộ mã nguồn Lua vào bộ nhớ (Memory) ngay khi Nginx khởi động.
        -- Tránh việc phải đọc lại file từ ổ cứng ở mỗi request, tối ưu triệt để độ trễ.
        ip_blacklist = require "ip_blacklist"
        xff_guard = require "xff_guard"
        geo_block = require "geo_block"
        bad_bot = require "bad_bot"
        rate_limit = require "rate_limit"
        rate_limit_redis = require "rate_limit_redis"
        waf = require "waf_sqli_xss"
        jwt_auth = require "jwt_auth"
        risk_engine = require "risk_engine"
        brute_force_login = require "brute_force_login" 
        telegram_alert = require "telegram_alert"
        metrics_labels = require "metrics_labels"

        local function concat_signals(signals)
            if not signals then return "" end
            return table.concat(signals, ",")
        end

        function security_alert(ctx, status)
            if not ctx or not ctx.security then return end

            local action = metrics_labels.action(status)
            local signals = ctx.security.signals or {}
            local reason = metrics_labels.reason(signals, action)

            local ip = ctx.security.client_ip
                or ngx.var.remote_addr
                or ngx.var.realip_remote_addr

            -- Count final security decisions without IP labels.
            if metric_security_decisions
                and (action == "block" or action == "limit") then

                metric_security_decisions:inc(1, {action, reason})
            end

            -- Keep IP information in logs, not Prometheus labels.
            local attack_type = (#signals > 0)
                and table.concat(signals, ", ")
                or (ctx.security.risk_action or "unknown")

            local score = tonumber(
                ctx.security.risk_final
                or ctx.security.risk
                or 0
            ) or 0

            -- The final HTTP decision is authoritative, including short-circuit
            -- blocks (e.g. pre-login) that never reach Risk Engine.
            ngx.var.log_security_block = action
            ngx.var.log_security_reason = reason
            ngx.var.log_risk_score = string.format("%.1f", score)

            ngx.log(
                ngx.WARN,
                "[SECURITY_EVENT] IP=", tostring(ip or "unknown"),
                " Action=", action,
                " Reason=", reason,
                " Attack=", attack_type,
                " Score=", score,
                " Signals=[", table.concat(signals, ","), "]"
            )
        end

        ngx.log(ngx.NOTICE, "[GATEWAY] All security modules loaded OK")
    }

    # ================= PROMETHEUS =================
    init_worker_by_lua_block {
        local ok, prometheus_lib = pcall(require, "prometheus")
        if not ok then
            ngx.log(ngx.ERR, "[PROMETHEUS] load failed: ", prometheus_lib)
            return
        end

        if not prometheus then
            prometheus = prometheus_lib.init("prometheus_metrics")

            metric_requests = prometheus:counter(
                "nginx_http_requests_total",
                "Total HTTP requests",
                {"status"}
            )

            metric_latency = prometheus:histogram(
                "nginx_http_request_duration_seconds",
                "Request latency",
                {},
                {0.005, 0.01, 0.05, 0.1, 0.5, 1, 5}
            )

            metric_security_decisions = prometheus:counter(
                "nginx_security_decisions_total",
                "Final security block/limit decisions",
                {"action", "reason"}
            )


            metric_risk = prometheus:histogram(
                "nginx_security_risk_score", "Request risk score distribution", {"action"},
                {0, 10, 20, 30, 50, 70, 80, 100}
            )
        end
    }

    log_by_lua_block {
        -- Hook chạy ở phase cuối cùng (sau khi đã trả response về cho user)
        -- để thống kê các chỉ số về Latency (độ trễ), Status code và phân bố điểm Risk mà không làm nghẽn luồng xử lý.
        if metric_requests then
            metric_requests:inc(1, {ngx.var.status})
        end

        if metric_latency then
            metric_latency:observe(
                tonumber(ngx.var.request_time) or 0,
                {}
            )
        end

        if ngx.ctx.security then
            local risk = ngx.ctx.security.risk_final or 0
            local action = ngx.ctx.security.risk_action or "pass"

            if metric_risk then
                metric_risk:observe(
                    math.max(0, math.min(100, tonumber(risk) or 0)),
                    {metrics_labels.action(action)}
                )
            end
        end
    }

    # =============================================================================
    # SERVER: PROMETHEUS METRICS (internal only)
    # =============================================================================
    server {
        # Đổi thành 9145 (hoặc 0.0.0.0:9145) để các container khác có thể gọi vào
        listen 9145; 

        set $log_risk_score "0";
        set $log_security_block "-";
        set $log_security_reason "-";

        location /metrics {
            # Bảo mật Endpoint Metrics: Chỉ cho phép Server nội bộ hoặc Docker Network
            # được phép kéo dữ liệu, chặn toàn bộ Internet ngoài để chống rò rỉ cấu trúc hệ thống.
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Mở cho dải IP mặc định của mạng Docker
            allow 192.168.0.0/16; # Mở cho dải IP mạng Docker custom (nếu có)
            deny  all;
            content_by_lua_block {
                if prometheus then prometheus:collect() else ngx.exit(503) end
            }
            access_log off;
        }
        location / { return 404; }
    }

    # =============================================================================
    # SERVER: HTTP → HTTPS REDIRECT
    # =============================================================================
    server {
        listen      80;
        server_name asg-datn.duckdns.org;

        set $log_risk_score "0";
        set $log_security_block "-";
        set $log_security_reason "-";

        location = /health/ {
            allow 127.0.0.1;
            allow 172.20.0.0/24;
            allow 172.31.0.0/16;
            deny all;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================================================================
    # SERVER: HTTPS (MAIN)
    # =============================================================================
    server {
        
        listen      443 ssl;
        http2       on;
        server_name asg-datn.duckdns.org;

        set $log_risk_score "0";
        set $log_security_block "-";
        set $log_security_reason "-";

        # ── TLS ─────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/asg-datn.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/asg-datn.duckdns.org/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        ssl_stapling        on;
        ssl_stapling_verify on;
        # DNS resolver để OCSP stapling hoat động (Google DNS)
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 5s;
        
        # ── SECURITY HEADERS ─────────────────────────────────────
        # Chặn các kiểu tấn công phổ biến ở Frontend (Trình duyệt):
        # Chống Clickjacking (X-Frame-Options), chặn rình mò định dạng file (nosniff),
        # ép buộc HTTPS tối đa (HSTS), và khóa các quyền truy cập phần cứng nguy hiểm (Permissions-Policy).
        add_header X-Frame-Options           "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options    "nosniff"                      always;
        add_header X-Request-ID              $request_id                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.amazonaws.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com; style-src 'self' 'unsafe-inline' https://*.amazonaws.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.amazonaws.com; font-src 'self' data: https://*.amazonaws.com https://cdnjs.cloudflare.com https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self';"
            always;

        # ── HEALTH CHECK ─────────────────────────────────────────
        location = /health/ {
            allow 127.0.0.1;
            allow 172.20.0.0/24;
            allow 172.31.0.0/16;
            deny all;

            proxy_pass http://django_backend;
            
            proxy_set_header Host  $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_connect_timeout  3s;
            proxy_read_timeout     3s;
            access_log off;
        }

        # ── STATIC / MEDIA ───────────────────────────────────────
        location /static/ {
            access_by_lua_block {
                local ctx = { security = { risk = 0 } }
                
                -- Đối với file tĩnh (.css, .js, .png), KHÔNG CHẠY WAF hay JWT.
                -- Mã nhị phân của ảnh có thể gây False Positive (chặn nhầm) nếu quét bằng Regex SQLi/XSS.
                -- Chỉ quét kiểm tra Blacklist và chặn Bot để tiết kiệm tài nguyên hệ thống.
                local modules = { ip_blacklist, bad_bot }
                
                for _, m in ipairs(modules) do
                    if ctx.security.block then break end
                    local ok, err = pcall(m.run, ctx)
                    if not ok then ngx.log(ngx.ERR, "[STATIC][SECURITY] module crash: ", err) end
                end

                -- Luôn chạy risk_engine để ghi Redis & gửi Telegram
                local ok_risk, err_risk = pcall(risk_engine.run, ctx)
                if not ok_risk then ngx.log(ngx.ERR, "[STATIC][RISK] crash: ", err_risk) end

                ngx.ctx.security = ctx.security
                local action = (ctx.security and ctx.security.risk_action) or ""

                if ctx.security.block or action == "block" then
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end
            }
            proxy_pass http://django_backend;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache static_cache; 
            proxy_cache_valid 200 1d;
            access_log /usr/local/openresty/nginx/logs/security.json.log security_json buffer=16k flush=5s if=$log_security_event;
        }

        location /media/ {
            access_by_lua_block {
                local ctx = { security = { risk = 0 } }
                local modules = { ip_blacklist, bad_bot }
                
                for _, m in ipairs(modules) do
                    if ctx.security.block then break end
                    local ok, err = pcall(m.run, ctx)
                    if not ok then ngx.log(ngx.ERR, "[MEDIA][SECURITY] module crash: ", err) end
                end

                -- Luôn chạy risk_engine để ghi Redis & gửi Telegram
                local ok_risk, err_risk = pcall(risk_engine.run, ctx)
                if not ok_risk then ngx.log(ngx.ERR, "[MEDIA][RISK] crash: ", err_risk) end

                ngx.ctx.security = ctx.security
                local action = (ctx.security and ctx.security.risk_action) or ""

                if ctx.security.block or action == "block" then
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end
            }
            proxy_pass http://django_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            access_log /usr/local/openresty/nginx/logs/security.json.log security_json buffer=16k flush=5s if=$log_security_event;
        }

        # ── ADMIN: restrict thêm ─────────────────────────────────
        location /admin/ {
            access_by_lua_block {
                -- Vùng nhạy cảm (/admin/): Bật cờ `admin_path = true`.
                -- Áp dụng toàn bộ 100% các công cụ bảo mật khắt khe nhất để bảo vệ Backend Admin.
                local ctx = { security = { risk = 0 }, admin_path = true }

                local modules = {
                    xff_guard,
                    ip_blacklist,
                    geo_block,        
                    bad_bot,
                    rate_limit,
                    rate_limit_redis, 
                    jwt_auth,
                    waf,
                }

                for _, m in ipairs(modules) do
                    if ctx.security.block then break end
                    local ok, err = pcall(m.run, ctx)

                    if not ok then
                        ngx.log(
                            ngx.ERR,
                            "[SECURITY] module crash: ",
                            err
                        )

                        -- JWT là module xác thực bắt buộc.
                        -- Không được chuyển request xuống Django nếu JWT module lỗi.
                        if m == jwt_auth then
                            return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                        end
                    end
                end

                local ok_risk, err_risk = pcall(risk_engine.run, ctx)
                if not ok_risk then ngx.log(ngx.ERR, "[ADMIN][RISK] crash: ", err_risk) end

                ngx.ctx.security = ctx.security
                local action = (ctx.security and ctx.security.risk_action) or ""
                
                -- Rate-only mitigation must be 429 even when block=true.
                if ctx.security.rate_only_limited and action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end

                if ctx.security.block or action == "block" then
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end
                if action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end
            }

            proxy_pass http://django_backend;
            
            proxy_http_version     1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_connect_timeout  5s;
            proxy_send_timeout     10s;
            proxy_read_timeout     10s;
        }

        # ── BRUTE-FORCE PROTECTION: /login/ (Pre-login check) ─────────────────────────────
        location ^~ /login {
            access_by_lua_block {
                local ctx = { 
                    security = { risk = 0 },
                    client_ip = ngx.var.remote_addr or ngx.var.realip_remote_addr
                }

                -- Chặn "Cửa Trứơc": Kiểm tra nhanh xem IP này có đang nằm trong 
                -- Lockout Cooldown (bị cấm vì dò pass) hay không. Nếu có, đá văng khỏi trang login ngay lập tức.
                local call_ok, is_locked, check_err = pcall(
                    brute_force_login.check_prelogin,
                    ctx
                )

                if not call_ok or is_locked == nil then
                    ngx.log(
                        ngx.ERR,
                        "[LOGIN] Cannot verify brute-force state: ",
                        tostring(check_err or is_locked)
                    )
                    return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                end

                if is_locked then
                    ngx.log(
                        ngx.WARN,
                        "[LOGIN] IP ",
                        ctx.client_ip,
                        " is locked out (pre-login)"
                    )
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end

                local modules = { ip_blacklist, bad_bot }
                for _, m in ipairs(modules) do
                    if ctx.security.block then break end
                    local ok2, err2 = pcall(m.run, ctx)
                    if not ok2 then ngx.log(ngx.ERR, "[LOGIN][SECURITY] module crash: ", err2) end
                end

                local ok_risk, err_risk = pcall(risk_engine.run, ctx)
                if not ok_risk then
                    ngx.log(ngx.ERR, "[LOGIN][RISK] crash: ", err_risk)
                end

                ngx.ctx.security = ctx.security
                local action = (ctx.security and ctx.security.risk_action) or ""

                if ctx.security.block or action == "block" then
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end
                if action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end
            }

            proxy_pass http://django_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── BRUTE-FORCE PROTECTION: /doLogin/ (Login attempt handler) ─────────────────────────────
        location ^~ /doLogin {
            access_by_lua_block {
                local ctx = { 
                    security = { risk = 0 },
                    client_ip = ngx.var.remote_addr or ngx.var.realip_remote_addr
                }

                local call_ok, is_locked, check_err = pcall(
                    brute_force_login.check_prelogin,
                    ctx
                )

                if not call_ok or is_locked == nil then
                    ngx.log(
                        ngx.ERR,
                        "[DOLOGIN] Cannot verify brute-force state: ",
                        tostring(check_err or is_locked)
                    )
                    return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                end

                if is_locked then
                    ngx.log(
                        ngx.WARN,
                        "[DOLOGIN] IP ",
                        ctx.client_ip,
                        " is locked out"
                    )
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end

                local modules = {
                    xff_guard,
                    ip_blacklist,
                    geo_block,
                    bad_bot,
                    rate_limit,
                    rate_limit_redis,
                }

                for _, m in ipairs(modules) do
                    if ctx.security.block then break end
                    pcall(m.run, ctx)
                end

                pcall(risk_engine.run, ctx)

                ngx.ctx.security = ctx.security
                local action = (ctx.security and ctx.security.risk_action) or ""

                -- Rate-only mitigation must be 429 even when block=true.
                if ctx.security.rate_only_limited and action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end

                if ctx.security.block or action == "block" then
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end
                if action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end
            }

            header_filter_by_lua_block {
                -- Tương tác bất đồng bộ (Async Trigger): Đọc Header `X-Login-Status`
                -- do Backend trả về để biết người dùng nhập đúng hay sai pass.
                -- Sau đó, đẩy công việc ghi nhận Brute-force vào hàm ngx.timer nền để Nginx
                -- không bị treo, trả Response về cho user ngay lập tức.
                local client_ip = ngx.var.remote_addr or ngx.var.realip_remote_addr
                local login_status = ngx.header["X-Login-Status"]

                if login_status == "failed" then
                    local timer_ok, timer_err = ngx.timer.at(
                        0,
                        function(premature, ip)
                            if premature then
                                return
                            end

                            local ok, result = pcall(
                                brute_force_login.record_failed_attempt,
                                {client_ip = ip}
                            )

                            if not ok then
                                ngx.log(
                                    ngx.CRIT,
                                    "[BRUTE_FORCE] Failed-attempt timer crashed: ",
                                    tostring(result)
                                )

                                brute_force_login.record_failed_attempt_fallback(
                                    {client_ip = ip},
                                    "failed-attempt timer callback crashed"
                                )
                            end
                        end,
                        client_ip
                    )

                    if not timer_ok then
                        ngx.log(
                            ngx.CRIT,
                            "[BRUTE_FORCE] Cannot create failed-attempt timer: ",
                            tostring(timer_err)
                        )

                        brute_force_login.record_failed_attempt_fallback(
                            {client_ip = client_ip},
                            "failed-attempt timer creation failure"
                        )
                    end
            }

            proxy_pass http://django_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    5s;
            proxy_read_timeout    10s;
        }

        # ── SECURITY PIPELINE (main) ─────────────────────────────
        location / {
            access_by_lua_block {
                local ctx = { security = { risk = 0 } }

                -- CHUỖI XỬ LÝ CHÍNH (Chain of Responsibility).
                -- Tất cả request vào hệ thống (không thuộc các ngoại lệ trên) đều phải
                -- lần lượt đi qua các ải bảo mật theo thứ tự ưu tiên từ nhẹ đến nặng (CPU).
                local modules = {
                    xff_guard,        
                    ip_blacklist,     
                    geo_block,        
                    bad_bot,          
                    rate_limit,       
                    rate_limit_redis, 
                    waf,              
                    jwt_auth,         
                }

                for _, m in ipairs(modules) do
                    -- Cơ chế Short-circuit: Nếu một Module phát hiện nguy hiểm 
                    -- và bật cờ `block=true`, vòng lặp sẽ dừng ngay lập tức. Không cho request 
                    -- chạy qua các module kế tiếp để bảo toàn CPU.
                    if ctx.security.block then break end
                    local ok, err = pcall(m.run, ctx)

                    if not ok then
                        ngx.log(
                            ngx.ERR,
                            "[SECURITY] module crash: ",
                            err
                        )

                        -- JWT là module xác thực bắt buộc.
                        -- Không được chuyển request xuống Django nếu JWT module lỗi.
                        if m == jwt_auth then
                            return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                        end
                    end
                end

                -- Sau khi tổng hợp toàn bộ tín hiệu (Signals) từ các Module trên,
                -- Risk Engine sẽ "chốt sổ" tính toán xem IP này có vượt quá giới hạn nguy hiểm không.
                local ok_risk, err_risk = pcall(risk_engine.run, ctx)
                if not ok_risk then ngx.log(ngx.ERR, "[RISK] crash: ", err_risk) end

                ngx.ctx.security = ctx.security
                local action = (ctx.security and ctx.security.risk_action) or ""

                -- Rate-only mitigation must be 429 even when block=true.
                if ctx.security.rate_only_limited and action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end

                if ctx.security.block or action == "block" then
                    security_alert(ctx, "block")
                    return ngx.exit(403)
                end
                if action == "limit" then
                    security_alert(ctx, "limit")
                    return ngx.exit(429)
                end
            }

            proxy_pass http://django_backend;

            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_buffering    on;
            proxy_buffers      16 16k;
            proxy_buffer_size  32k;

            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }
}